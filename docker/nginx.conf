# Nostalgex self-hosted web tuner. Static files only, plain http on port 8080.
# Replaces /etc/nginx/conf.d/default.conf, so it sits inside the image's http {} block.

# The shared channel filter ships as scripts/nostalgex-channel-filter.cjs. nginx has
# no type for .cjs, and with nosniff a wrong type blocks the script, which kills the
# library load. This adds to the stock mime.types rather than replacing it.
types {
    application/javascript cjs mjs;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative Location headers, so redirects keep whatever host and port the
    # browser used (a mapped port, a LAN name, a reverse proxy).
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript application/json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # No HSTS: this is plain http on a home network on purpose. The CSP allows
    # http: and https: media servers, since the whole point is reaching a LAN server.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http: https:; media-src 'self' blob: data: http: https:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # Pages, channels.json and the helper scripts change with every release.
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    # Vite's hashed bundle names.
    location /assets/ {
        expires 1y;
    }

    # hls.js and qrcodejs are loaded with a ?v=<version> query; fonts rarely move.
    location /vendor/ {
        expires 7d;
    }

    # Written at container start by /docker-entrypoint.d/40-config.sh from
    # NOSTALGEX_ENRICHMENT. Lives in /tmp so a read-only root filesystem works.
    location = /config.json {
        root /tmp/nostalgex;
        expires -1;
    }

    # The shared lineup (I-080): one small file every browser reads and writes, so a new
    # browser starts with the same packages on. docker/40-config.sh writes
    # /tmp/nostalgex/settings.conf only when this nginx has the WebDAV module and
    # NOSTALGEX_SHARED_SETTINGS is not off. Otherwise the include matches nothing, this
    # location does not exist, and the page keeps its settings in each browser, as before.
    include /tmp/nostalgex/*.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
