# Nostalgex — confidence guardrails (web build + tvOS unit tests)
# Repo layout: https://github.com/chadMueller/Nostalgex — see docs/REPOSITORY-LAYOUT.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      tvos: ${{ steps.filter.outputs.tvos }}
      config: ${{ steps.filter.outputs.config }}
      docker: ${{ steps.filter.outputs.docker }}
      roku: ${{ steps.filter.outputs.roku }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'index.html'
              - 'apple-tv.html'
              - 'plex-tuner.html'
              - 'web-tuner.html'
              - 'support.html'
              - 'privacy.html'
              - 'terms.html'
              - '404.html'
              - 'styles.css'
              - 'tuner/**'
              - '.dockerignore'
              - 'channels.json'
              - 'franchises.json'
              - 'api/**'
              - 'content/**'
              - 'docs/**'
              - 'img/**'
              - 'logo/**'
              - 'public/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'docker/**'
            tvos:
              - '.github/workflows/ci.yml'
              - 'Nostalgex/**'
              - 'franchises.json'
              - 'scripts/franchise-golden.json'
              - 'scripts/franchise-lineup-golden.json'
              - 'scripts/schedule-dst-golden.json'
              - 'scripts/schedule-parity-golden.json'
              - 'scripts/filter-golden.json'
              - 'scripts/rating-golden.json'
            config:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'channels.json'
              - 'channels-memberships.json'
              - 'CHANNELS.md'
              - 'scripts/render-channels-doc.mjs'
              - 'scripts/nostalgex-channel-filter.cjs'
              - 'scripts/nostalgex-daily-manifest.js'
              - 'scripts/nostalgex-filter-smoke.mjs'
              - 'scripts/nostalgex-schedule-order-smoke.mjs'
              - 'scripts/nostalgex-schedule-dst-smoke.mjs'
              - 'scripts/schedule-dst-golden.json'
              # What airs: the engine against the Apple TV's answers.
              - 'scripts/nostalgex-schedule-parity-smoke.mjs'
              - 'scripts/schedule-parity-dump.mjs'
              - 'scripts/schedule-parity-golden.json'
              # START OVER on the loading screen.
              - 'scripts/start-over-smoke.mjs'
              - 'franchises.json'
              - 'scripts/franchise-golden.json'
              - 'scripts/franchise-lineup-golden.json'
              - 'scripts/nostalgex-franchise-builder.js'
              - 'scripts/nostalgex-collections.js'
              - 'scripts/nostalgex-collections-smoke.mjs'
              - 'scripts/nostalgex-franchise-smoke.mjs'
              - 'scripts/nostalgex-franchise-lineup.js'
              - 'scripts/nostalgex-franchise-lineup-smoke.mjs'
              - 'scripts/filter-golden.json'
              - 'scripts/nostalgex-filter-golden-smoke.mjs'
              - 'scripts/rating-golden.json'
              - 'scripts/nostalgex-rating-smoke.mjs'
              # The ratings smoke test reads VHS VAULT's 9 PM rule out of the page.
              - 'plex-tuner.html'
              # The sign-in screens: npm test runs their logic and the Quick Connect test.
              - 'web-tuner.html'
              - 'scripts/nostalgex-signin.js'
              - 'scripts/nostalgex-signin-smoke.mjs'
              - 'scripts/signin-golden.json'
              - 'scripts/nostalgex-jellyfin-quick-connect-smoke.mjs'
              # The tuner stays apart from the site: npm run test:tuner-isolation reads these
              # (plus plex-tuner.html, listed above).
              - 'tuner/**'
              - 'scripts/tuner-isolation-check.mjs'
              - 'vite.config.js'
              - '.dockerignore'
              - 'vercel.json'
              - 'scripts/site-chrome.mjs'
              - 'scripts/build-blog.mjs'
              - 'scripts/build-bundles.mjs'
              - 'scripts/site-media.mjs'
            docker:
              - '.github/workflows/ci.yml'
              - '.github/workflows/docker.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker/**'
              - 'vite.config.*'
              - 'scripts/selfhost-build.mjs'
              - 'tuner/**'
              - 'web-tuner.html'
              - 'plex-tuner.html'
              - 'scripts/tuner-version.mjs'
              - 'package.json'
              - 'package-lock.json'
            # The Roku port, plus everything its golden vectors are generated
            # from (roku/tests/gen-*.mjs): the shared data and the JS engine.
            roku:
              - '.github/workflows/ci.yml'
              - 'roku/**'
              - 'channels.json'
              - 'channels-memberships.json'
              - 'franchises.json'
              - 'plex-tuner.html'
              - 'scripts/nostalgex-daily-manifest.js'
              - 'scripts/nostalgex-channel-filter.cjs'
              - 'scripts/nostalgex-franchise-builder.js'
              - 'scripts/nostalgex-enrichment.js'
              - 'scripts/nostalgex-collections.js'
              - 'scripts/franchise-golden.json'
              - 'scripts/franchise-lineup-golden.json'
              - 'scripts/nostalgex-franchise-smoke.mjs'
              - 'scripts/nostalgex-franchise-lineup.js'
              - 'scripts/nostalgex-franchise-lineup-smoke.mjs'
              - 'scripts/nostalgex-collections-smoke.mjs'
              - 'scripts/nostalgex-jellyfin-urls.js'
              - 'scripts/nostalgex-music-brainz.js'
              - 'scripts/nostalgex-season.js'
              - 'scripts/filter-golden.json'
              - 'scripts/season-golden.json'
              - 'scripts/schedule-dst-golden.json'
              - 'scripts/nostalgex-filter-golden-smoke.mjs'
              - 'scripts/nostalgex-season-smoke.mjs'
              - 'scripts/rating-golden.json'
              - 'scripts/nostalgex-rating-smoke.mjs'

  # Every pull request, whatever it touches: the repo is public, and this keeps the
  # maintainer's home network and real server names out of it. No npm install needed.
  public-repo-hygiene:
    name: No home-network details in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak guard
        run: node scripts/public-repo-leak-guard.mjs

  channel-engine:
    name: Channel engine (rule parity, schedule order, docs)
    needs: changes
    if: ${{ needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Three guardrails against the drift found in the 2026-09-02 audit:
      #   test:filter        - the shared JS rule filter still honours every
      #                        channels.json field (imdbRatingMin/imdbVotesMin
      #                        were silently missing on web while Swift enforced them)
      #   test:schedule      - web daily-manifest ordering still matches the tvOS
      #                        SchedulePoolOrdering, so both surfaces air the same program
      #   test:franchises    - web franchise grouping reproduces scripts/franchise-golden.json,
      #                        the same vectors FranchiseGoldenTests checks on tvOS
      #   channels:doc:check - CHANNELS.md is regenerated from channels.json
      #                        (it had drifted 8 config versions)
      - name: Run channel engine checks
        run: npm test

  web-build:
    name: Web (Vite build)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      # The Docker web tuner's build: same pages, vendored scripts and fonts. It
      # fails on unbalanced selfhost markers or a remote script left in the page.
      - name: Self-host build
        run: npm run build:selfhost

      # Both builds carry package.json "tunerVersion" (the Settings version line).
      - name: Tuner version in both builds
        run: npm run test:tuner-version:builds

      # A site-only edit (styles.css, app.js, index.html, site-chrome, public/) must not
      # change one byte the tuner ships, hosted or Docker.
      - name: Tuner untouched by site-only edits
        run: npm run test:tuner-isolation:builds

  docker-smoke:
    name: Docker image (build and run, no push)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: nostalgex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run and probe
        run: |
          set -eu
          docker run -d --name on -p 8080:8080 --read-only --tmpfs /tmp nostalgex:ci
          docker run -d --name off -p 8081:8080 --read-only --tmpfs /tmp -e NOSTALGEX_ENRICHMENT=off -e NOSTALGEX_TUNER_VERSION=9.9.9-ci nostalgex:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'name="nostalgex-build" content="selfhost"'
          curl -fsS http://127.0.0.1:8080/plex-tuner.html | grep -q 'vendor/hls.min.js'
          curl -fsS -o /dev/null -w '%{content_type}\n' http://127.0.0.1:8080/scripts/nostalgex-channel-filter.cjs | grep -q '^application/javascript'
          curl -fsS http://127.0.0.1:8080/config.json | grep -q '"enrichment":true'
          curl -fsS http://127.0.0.1:8081/config.json | grep -q '"enrichment":false'
          # No build arg here, so the image carries package.json "tunerVersion"; the
          # container's environment wins at start.
          want="$(jq -r .tunerVersion package.json)"
          tuner_page="$(curl -fsS http://127.0.0.1:8080/plex-tuner.html)"
          grep -q "name=\"nostalgex-tuner-version\" content=\"$want\"" <<<"$tuner_page"
          curl -fsS http://127.0.0.1:8080/config.json | grep -q "\"tunerVersion\":\"$want\""
          curl -fsS http://127.0.0.1:8081/config.json | grep -q '"tunerVersion":"9.9.9-ci"'
          test "$(docker exec on id -u)" = "101"
          echo "docker smoke ok"

      - name: Logs on failure
        if: failure()
        run: docker logs on || true

  roku:
    name: Roku port (golden vectors, off-device)
    needs: changes
    if: ${{ needs.changes.outputs.roku == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # pr-check reads the commits and the lines a PR adds against its base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Java 21 is for Roku's static analysis, which pr-check runs when it is
      # here. If the tool can't be fetched the check says NOT RUN.
      - uses: actions/setup-java@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          distribution: temurin
          java-version: "21"

      # roku/tests/run.sh regenerates the golden vectors from this checkout's
      # JS engine and data, then runs the BrightScript port against them in the
      # RokuCommunity brs interpreter. No npm install: it needs node and npx
      # only. The interpreter is a first check; roku/scripts/deploy.sh --test
      # on a TV is the one that counts.
      - name: Golden vectors (off-device)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          node --version
          roku/tests/run.sh

      # On a pull request: the same suite plus the mechanical review checks
      # (test lists, includes, uninitialized reads, repeated keys, the package,
      # AI trailers, secrets, addresses, dashes, static analysis), one line each,
      # in the job summary. roku/tests/README.md says what each proves.
      - name: Roku PR checks (the suite and the review checks)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          node --version
          roku/tests/pr-check.sh HEAD --here --base "origin/${{ github.base_ref }}" --summary "$GITHUB_STEP_SUMMARY"

  tvos-unit-tests:
    name: tvOS unit tests (NostalgexTests)
    needs: changes
    if: ${{ needs.changes.outputs.tvos == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # tvOS deployment target must be ≤ SDK on the runner (GitHub ships Xcode 16.x; tvOS 26 SDK is not available).
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available "tvOS" | head -40

      - name: Run NostalgexTests
        run: |
          set -eo pipefail
          xcodebuild test \
            -project Nostalgex/Nostalgex.xcodeproj \
            -scheme Nostalgex \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -only-testing:NostalgexTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
